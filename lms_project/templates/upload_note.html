{% extends "base.html" %}
{% block title %}Share notes{% endblock %}
{% block content %}

<section class="form-card">
  <div class="panel-head">
    <span class="tally">Teacher</span>
    <h2>Share a note with the class</h2>
  </div>

  <form method="POST" enctype="multipart/form-data" class="stack-form">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" placeholder="e.g. Week 4 — Fractions" required>

    <label for="file">File</label>
    <input type="file" id="file" name="file" required>
    <p class="hint">Accepted: pdf, doc(x), ppt(x), txt, png, jpg — up to 25MB.</p>

    <button type="submit">Upload note</button>
  </form>

  <a class="back-link" href="{{ url_for('index') }}">&larr; Back to dashboard</a>
</section>

{% endblock %}
