{% extends "base.html" %}
{% block title %}Login – Siyafundza LMS{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-mortarboard-fill" style="font-size:2.5rem;color:#1F4E79"></i>
        <h3 class="mt-2">Siyafundza LMS</h3>
        <p class="text-muted">Sign in to continue</p>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-0">
        No account? <a href="{{ url_for('register') }}">Register</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
